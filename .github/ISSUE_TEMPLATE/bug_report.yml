name: Bug report / 問題回報
description: Reproducible Tangyi Cam or browser demo issue / 可重現的問題
body:
  - type: markdown
    attributes:
      value: Do not include pairing codes, private certificates, API keys or private scene files. 請勿提供配對碼、私鑰或私人場景。
  - type: dropdown
    id: area
    attributes:
      label: Area / 發生位置
      options:
        - Blender add-on / 正式外掛
        - Browser demo / 網頁示範
        - Installation or docs / 安裝或文件
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions / 版本
      description: Tangyi Cam, Blender, Windows, phone OS and browser.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / 重現步驟
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual behavior / 預期與實際結果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs / 已移除敏感內容的紀錄
